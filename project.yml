# XcodeGen spec. Generate the Xcode project on a Mac with:  xcodegen generate
# UNVERIFIED: this project has not been built with Xcode yet (see docs/BUILD-ON-MAC.md).
name: Rocky

options:
  bundleIdPrefix: cz.semmler
  developmentLanguage: cs
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your team in Xcode (Signing & Capabilities) or here.
    DEVELOPMENT_TEAM: ""
    # App targets use Swift 5 mode with complete concurrency checking (warnings, not errors)
    # so the first build on a Mac is not blocked by strict-concurrency errors. RockyCore
    # itself is built in Swift 6 language mode. See docs/DECISIONS.md (D-16).
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Placeholder icon (App/Assets.xcassets, generated by tools/make-icon.swift).
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

packages:
  RockyCore:
    path: Packages/RockyCore

targets:
  Rocky:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App/iOS
      - path: App/Shared
      - path: App/Assets.xcassets
    dependencies:
      - package: RockyCore
      - target: RockyWatch
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    info:
      path: App/iOS/Info.plist
      properties:
        CFBundleDisplayName: Rocky
        CFBundleDevelopmentRegion: cs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Voice cues keep running with the screen locked.
        UIBackgroundModes:
          - audio
        NSHealthShareUsageDescription: Aplikace čte tep a energii z tréninku, aby ti je ukázala v souhrnu.
        NSHealthUpdateUsageDescription: Aplikace ukládá odcvičené tréninky do aplikace Zdraví.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/iOS/Rocky.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cz.semmler.rocky
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Catch-up and escalated reminders break through Focus (D-19).
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.semmler.rocky
        PRODUCT_NAME: Rocky
        TARGETED_DEVICE_FAMILY: "1"

  RockyWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: App/Watch
      - path: App/Shared
      - path: App/Assets.xcassets
    dependencies:
      - package: RockyCore
      - target: RockyWatchWidgets
        embed: true
    info:
      path: App/Watch/Info.plist
      properties:
        CFBundleDisplayName: Rocky
        CFBundleDevelopmentRegion: cs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: cz.semmler.rocky
        # HKWorkoutSession keeps the app running during the workout.
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: Aplikace čte tep a energii z tréninku, aby ti je ukázala v souhrnu.
        NSHealthUpdateUsageDescription: Aplikace ukládá odcvičené tréninky do aplikace Zdraví.
    entitlements:
      path: App/Watch/RockyWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Shared with the complication extension (reads the watch's local JSON), D-21.
        com.apple.security.application-groups:
          - group.cz.semmler.rocky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.semmler.rocky.watchkitapp
        PRODUCT_NAME: RockyWatch
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

  RockyWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: App/WatchWidgets
      - path: App/Shared/AppConstants.swift
      - path: App/Shared/Formatting.swift
      - path: App/Shared/TrainingStore.swift
    dependencies:
      - package: RockyCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: App/WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Rocky
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: App/WatchWidgets/RockyWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.cz.semmler.rocky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.semmler.rocky.watchkitapp.widgets
        PRODUCT_NAME: RockyWatchWidgets
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

  RockyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App/UITests
    dependencies:
      - target: Rocky
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.semmler.rocky.uitests
        TEST_TARGET_NAME: Rocky
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Rocky:
    build:
      targets:
        Rocky: all
        RockyWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RockyUITests
  RockyWatch:
    build:
      targets:
        RockyWatch: all
    run:
      config: Debug
