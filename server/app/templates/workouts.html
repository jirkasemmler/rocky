{% extends "base.html" %}
{% block title %}Tréninky{% endblock %}
{% block content %}
<h1>Tréninky <span class="muted">revize {{ revision }}</span></h1>
{% for w in workouts %}
<form method="post" action="/admin/workouts/{{ w.id }}" class="card">
  <h2>{{ w.id }}</h2>
  <input type="hidden" name="csrf" value="{{ session.csrf }}">
  <input type="hidden" name="base_revision" value="{{ revision }}">
  <label>Název <input name="name" value="{{ w.name }}" required maxlength="60"></label>
  <label>Cviky v pořadí (ID oddělená čárkou, 1–8) <input name="exerciseIDs" value="{{ w.exerciseIDs | join(', ') }}" required></label>
  <button type="submit">Uložit trénink {{ w.id }}</button>
</form>
{% endfor %}
<h2>Dostupné cviky</h2>
<ul class="columns">
{% for e in available %}<li><code>{{ e.id }}</code> {{ e.name }}</li>{% endfor %}
</ul>
{% endblock %}
