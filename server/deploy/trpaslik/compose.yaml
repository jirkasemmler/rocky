# Rocky server on trpaslik (production). Lives in /opt/rocky/compose.yaml; source in /opt/rocky/src.
# Tailscale sidecar gives the server its own tailnet name https://rocky.taile09d6f.ts.net
# (Holister keeps https://trpaslik…/). Rocky shares the sidecar's network namespace.
# Deploy: server/deploy/trpaslik/deploy.sh (from the Mac).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: rocky-tailscale
    hostname: rocky
    restart: unless-stopped
    environment:
      TS_HOSTNAME: rocky
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      # No auth key: on first start the log prints a login URL; state is kept in the volume.
    volumes:
      - /srv/rocky/tailscale:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    ports:
      # Loopback only (Holister health checks, local admin CLI); never 0.0.0.0.
      - "127.0.0.1:8787:8787"
    logging: *logging

  rocky:
    build: ./src
    image: rocky-server:0.1.0
    container_name: rocky
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      - /srv/rocky/data:/data
    environment:
      TZ: Europe/Prague
      ROCKY_BACKUP_HOUR: "3"
    logging: *logging
